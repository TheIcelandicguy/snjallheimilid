<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Snjallheimilið – í vinnslu</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f6f4ef; --text: #1f2328; --muted: #6b6f76; --accent: #c8781a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171a; --text: #e4e7ea; --muted: #8b949c; --accent: #f5a524; color-scheme: dark; } }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 17px/1.5 system-ui, "Segoe UI", sans-serif; min-height: 100vh; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 32em; text-align: center; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 .4em; line-height: 1.2; }
  h1 span { color: var(--accent); }
  p { margin: 0 0 1em; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><span>Snjallheimilið</span></h1>
  <p>Síðan er í vinnslu og opnar fljótlega.</p>
  <p>Snjallvæðing heimila á Akureyri.</p>
</main>
</body>
</html>
